<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#f3f7f4"/>

  <!-- Subtle top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#2d5a3d"/>

  <!-- Decorative leaf/sprout motif -->
  <g transform="translate(940, 380) scale(2.2)" opacity="0.06">
    <path d="M50 90 C50 50 20 30 10 20 C10 60 30 90 50 90 Z" fill="#2d5a3d"/>
    <path d="M50 90 C50 50 80 30 90 20 C90 60 70 90 50 90 Z" fill="#2d5a3d"/>
    <line x1="50" y1="90" x2="50" y2="130" stroke="#2d5a3d" stroke-width="3"/>
  </g>

  <!-- Logo icon -->
  <g transform="translate(140, 130)">
    <rect width="64" height="64" rx="14" fill="#2d5a3d"/>
    <g transform="translate(16, 16)" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 28 L16 14"/>
      <path d="M16 14 C16 10 12 6 6 6 C6 12 10 16 16 16 Z" fill="white" fill-opacity="0.2"/>
      <path d="M16 18 C16 14 20 10 26 10 C26 16 22 20 16 20 Z" fill="white" fill-opacity="0.2"/>
      <path d="M8 28 L24 28"/>
    </g>
  </g>

  <!-- NERAYA -->
  <text x="224" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="600" fill="#1e3024" letter-spacing="0.5">Neraya</text>

  <!-- Main headline -->
  <text x="140" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#1e3024" letter-spacing="-1">Agricultural Intelligence</text>
  <text x="140" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#1e3024" letter-spacing="-1">for the Farmer</text>

  <!-- Tagline -->
  <text x="140" y="478" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#4a6b54">Know your field. Feel its pulse. Decide with confidence.</text>

  <!-- Bottom accent line -->
  <rect x="140" y="540" width="80" height="3" fill="#2d5a3d" rx="1.5"/>
</svg>
